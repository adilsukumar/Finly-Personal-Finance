<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="t d"><title id="t">Finly. Every small expense. A little more clarity. Keep track of the life between the numbers.</title><desc id="d">Finly. Every small expense. A little more clarity. Keep track of the life between the numbers. Conceptual ledger illustration, not real financial data or an app screenshot.</desc><style>@keyframes ledger{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ledger{animation:ledger 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ledger,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >FINLY / ADIL SUKUMAR</text><text x="30" y="161" font-family="Bahnschrift, Arial, sans-serif" font-size="73" fill="#F8F8F3" font-weight="700" >Every small expense.</text><text x="30" y="238" font-family="Bahnschrift, Arial, sans-serif" font-size="71" fill="#BCFCF6" font-weight="700" >A little more clarity.</text><text x="32" y="312" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >A record of the everyday, so the end of the</text><text x="32" y="346" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >month makes more sense.</text><g transform="translate(815 365) scale(0.66)"><rect x="0" y="0" width="300" height="300" rx="18" fill="#141320" stroke="#343044"/><text x="22" y="40" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#F3D962" font-weight="600" >THE EVERYDAY LEDGER</text><g class="ledger" style="animation-delay:-0s"><circle cx="32" cy="78" r="10" fill="#BCFCF6"/><text x="57" y="84" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#BCFCF6" font-weight="600" >INCOME</text><path d="M57 103H265" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="ledger" style="animation-delay:-3s"><circle cx="32" cy="145" r="10" fill="#FF4081"/><text x="57" y="151" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#FF4081" font-weight="600" >EXPENSES</text><path d="M57 170H265" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="ledger" style="animation-delay:-6s"><circle cx="32" cy="212" r="10" fill="#A783F7"/><text x="57" y="218" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#A783F7" font-weight="600" >SHARED</text><path d="M57 237H265" fill="none" stroke="#343044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="22" y="282" font-family="Bahnschrift, Arial, sans-serif" font-size="16" fill="#BCFCF6" font-weight="600" >SMALL ENTRIES. CLEARER MONTHS.</text></g><text x="32" y="648" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#F3D962" font-weight="600" >Keep track of the life between the numbers.</text></svg>