<svg xmlns="http://www.w3.org/2000/svg" width="640" height="992" viewBox="0 0 640 992" role="img" aria-labelledby="t d"><title id="t">EVERYDAY RECORDS. Log income and expenses with categories, notes and paid-by details.; PERSONAL &amp; SHARED. Switch account views and inspect per-person shared balances.; SPENDING PATTERNS. Explore category breakdowns, daily activity and top expenses.; REPORTS &amp; BACKUPS. Generate a PDF report or move records with a JSON backup.</title><desc id="d">EVERYDAY RECORDS. Log income and expenses with categories, notes and paid-by details.; PERSONAL &amp; SHARED. Switch account views and inspect per-person shared balances.; SPENDING PATTERNS. Explore category breakdowns, daily activity and top expenses.; REPORTS &amp; BACKUPS. Generate a PDF report or move records with a JSON backup. Conceptual ledger illustration, not real financial data or an app screenshot.</desc><style>@keyframes ledger{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ledger{animation:ledger 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ledger,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M5 10h32v30H5zM5 10l25-7v7M26 21h15v12H26zM31 27h1" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight