<svg xmlns="http://www.w3.org/2000/svg" width="640" height="747" viewBox="0 0 640 747" role="img" aria-labelledby="t d"><title id="t">TWO ACCOUNT VIEWS. Personal transactions can mirror into the shared account when its active period exists.; WHO PAID WHAT. Shared contribution settings and paid-by details support per-person totals.; IOUs &amp; SETTLEMENTS. Track money owed and record settlements in the active account.</title><desc id="d">TWO ACCOUNT VIEWS. Personal transactions can mirror into the shared account when its active period exists.; WHO PAID WHAT. Shared contribution settings and paid-by details support per-person totals.; IOUs &amp; SETTLEMENTS. Track money owed and record settlements in the active account. Conceptual ledger illustration, not real financial data or an app screenshot.</desc><style>@keyframes ledger{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ledger{animation:ledger 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ledger,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M15 5a7 7 0 1 0 0 14a7 7 0 1 0 0-14M30 8a6 6 0 1 1 0 12M3 40v-8c0-10 24-10 24 0v8M31 26c9 0 10 6 10 14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >TWO ACCOUNT VIEWS</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Personal transactions can mirror into</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >the shared account when its active</text><text x="48" y="190" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >period exists.</text><rect x="24" y="257" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 279) scale(0.9090909090909091)"><path d="M4 10h36M4 34h36M14 4v12M31 27l-11 13M20 27l11 13" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="308" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >WHO PAID WHAT</text><text x="48" y="367" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Shared contribution settings and</text><text x="48" y="401" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >paid-by details support per-person</text><text x="48" y="435" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >totals.</text><rect x="24" y="502" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 524) scale(0.9090909090909091)"><path d="M5 8h34v28H5zM12 17h20M12 26h8M26 26h6" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="553" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >IOUs &amp; SETTLEMENTS</text><text x="48" y="612" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Track money owed and record settlements</text><text x="48" y="646" font-family="Bahnschrift, Arial, sans-serif" font-size="