<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="t d"><title id="t">ON THIS BROWSER. Records live in localStorage, scoped to this site and browser profile.; JSON BACKUP. Export and import records through Settings; imports replace supplied data groups.; SHARED PIN SCREEN. A local access screen with a hashed PIN; transaction data remains unencrypted.</title><desc id="d">ON THIS BROWSER. Records live in localStorage, scoped to this site and browser profile.; JSON BACKUP. Export and import records through Settings; imports replace supplied data groups.; SHARED PIN SCREEN. A local access screen with a hashed PIN; transaction data remains unencrypted. Conceptual ledger illustration, not real financial data or an app screenshot.</desc><style>@keyframes ledger{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}.ledger{animation:ledger 9s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.ledger,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M4 7h36v27H4zM22 34v8M13 42h18" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >ON THIS BROWSER</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Records live in localStorage,</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >scoped to this site and browser</text><text x="48" y="190" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >profile.</text><rect x="574" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(596 34) scale(0.9090909090909091)"><path d="M8 3h19l10 11v27H8zM27 3v12h10M14 23h17M14 31h13" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >JSON BACKUP</text><text x="598" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Export and import records through</text><text x="598" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Settings; imports replace supplied</text><text x="598" y="190" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >data groups.</text><rect x="24" y="287" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 309) scale(0.9090909090909091)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="338" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >SHARED PIN SCREEN</text><text x="48" y="397" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >A local access screen with a</text><text x="48" y="431" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >hashed PIN; transaction data</text><text x="48" y="465" font-f